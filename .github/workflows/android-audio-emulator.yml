name: Android audio emulator harness (b)

on:
  push:
    branches:
      - ci/android-audio-emulator-20261010-b
  workflow_dispatch:
    inputs:
      run_s3:
        description: 'Also run the S3 real-Lampa-APK job (heavier, sequential)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harness:
    name: S1+S2 WebView harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          ls -d "$ANDROID_SDK_ROOT"/platforms/* || true

      - name: Build harness APK (aapt2 + d8 + apksigner, no Gradle)
        run: bash ci/android-audio-harness/build-apk.sh

      # NOTE: ubuntu-latest has no /dev/kvm -> the action adds `-accel off` and the guest
      # runs on QEMU TCG (boot 16.7 min on API 34; the AOSP API 30 image with 4 cores is
      # ~3x faster). API 30 AOSP ships Chromium 83, i.e. exactly the WebView that cannot
      # parse `??=`/`||=` in mpvwasm-demuxer-st.js. This run therefore INTERCEPTS that one
      # URL and serves a downlevelled copy from the APK, to prove the operator is the only
      # blocker. Unmodified-WebView comparison = run 38032622992.
      - name: Boot emulator and run scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 3072
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: timeout 2400 bash ci/android-audio-harness/run-in-emulator.sh; echo "script-exit=$?"

      - name: Show status summary
        if: always()
        run: cat artifacts/status.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-audio-emulator-artifacts-b
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  s3-real-lampa-apk:
    name: S3 real Lampa APK (bounded attempt)
    if: inputs.run_s3
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Inspect the real Lampa client APK from ARST113/LAMPA releases
        id: apk
        run: bash ci/android-audio-harness/s3-fetch-apk.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot emulator with the real APK
        if: steps.apk.outputs.abi != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 3072
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: timeout 1800 bash ci/android-audio-harness/s3-run.sh; echo "s3-exit=$?"

      - name: Upload S3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-s3-real-lampa-apk-b
          path: artifacts-s3/
          if-no-files-found: warn
          retention-days: 7
