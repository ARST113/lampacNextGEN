---
name: Test - Build all projects

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read
  packages: read
  id-token: write

jobs:
  synchronization:
    name: Synchronization contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      - name: Account and transport checks
        run: node --test --test-isolation=none tests/lampac-sync-settings.test.js tests/lampac-sync-modules.test.js
      - name: Backend controller checks
        run: dotnet run --project tests/Lampac.Sync.Tests/Lampac.Sync.Tests.csproj --configuration Release

  test-build:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '10.0.x' }}

      - name: Restore
        run: dotnet restore --verbosity minimal NextGen.slnx

      - name: Build
        run: dotnet build NextGen.slnx --configuration Release --verbosity minimal
